name: Local code checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:local
      - run: node --test tests/updates.test.mjs
      - run: npm run test:media-ui
